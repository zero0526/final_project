NEURON_NET:
    BATCH_SIZE: 128
    MEMORY_SIZE: 300000
    BUFFER_MIN_SIZE: [256, 2560]
    ANNEALING_LENGTH: 2000
    NUMOF_TEST_EP: 10
    NUMOF_TRAIN_EP: 6000
    NUMOF_TF_EP: 10
    TIME_SLOT_PER_TIMEFRAME: 10
    SLOT_DURATION: 0.35

    NUM_LOWER_AGENTS: 20
    OMEGA_Q1: 1000.0
    OMEGA_Q2: 0.1 # Reduced from 0.12 to prevent exponential explosion
    OMEGA_Q3: 5

    HIDDEN_MF: 50
    HIDDEN_Q1: 256
    HIDDEN_Q2: 128

    UPPER_LR: 1e-4
    LOWER_LR: 1e-4
    MF_LR: 1e-4
    AGENT_HIDDEN_LAYER: [128, 64]
    MF_HIDDEN_LAYER: [50, 50]
    DISCOUNT_FACTOR: 0.95
    UPDATE_TARGET_COEF: 0.005 # 0.005
    ZETA: 1.0
    ZETA_MAX: 10
    EPSILON: 0.05 # 0.01
    EPSILON_DECAY: 0.995
    ZETA_LOWER_STEP: 0.0005 # Increased from 0.00005 for faster annealing
    ZETA_UPPER_STEP: 0.001

